.hdr-inner{max-width:1600px;margin:0 auto;position:relative;z-index:1}

.hdr-title h1{font-size:clamp(22px,3.2vw,32px);font-weight:700;letter-spacing:-.02em;margin-bottom:6px;background:linear-gradient(90deg,#fff,#bfdbfe);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sub{font-size:clamp(13px,1.4vw,15px);color:#94a3b8;margin-top:4px}

.stat-num{font-size:clamp(24px,3vw,32px);font-weight:700;color:#fff;margin-bottom:2px;font-family:var(--f-mono)}
.stat-label{font-size:13px;color:#cbd5e1}
.page-wrapper{max-width:1600px;margin:0 auto;padding:0 clamp(12px,3vw,32px) 40px}
.tabbar{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);margin-bottom:16px;scrollbar-width:thin}
.tabbar::-webkit-scrollbar{height:6px}
.tabbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.tab-btn{flex-shrink:0;padding:10px 16px;border:0;background:transparent;color:var(--c-muted);font-size:13px;font-weight:500;font-family:var(--f-body);cursor:pointer;border-radius:6px;transition:all .18s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab-btn:hover{background:#f1f5f9;color:var(--c-text)}
.tab-btn.active{background:var(--c-accent);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.3)}
.tab-btn .cnt{font-size:11px;padding:1px 6px;background:rgba(0,0,0,.1);border-radius:10px;font-family:var(--f-mono)}
.tab-btn.active .cnt{background:rgba(255,255,255,.25)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md)}
.search-box{position:relative;flex:1;min-width:220px;max-width:480px}
.search-box input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-surface);font-size:14px;font-family:var(--f-body);color:var(--c-text);outline:none;transition:border-color .2s,box-shadow .2s}
.search-box input:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--c-muted);pointer-events:none}
.toolbar select,.toolbar button{padding:10px 14px;border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-surface);font-size:13px;font-family:var(--f-body);color:var(--c-text);cursor:pointer;outline:none;transition:all .18s}
.toolbar select:hover,.toolbar button:hover{border-color:var(--c-accent);color:var(--c-accent)}
.toolbar button.export{background:var(--c-accent);color:#fff;border-color:var(--c-accent);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.toolbar button.export:hover{background:var(--c-accent-h)}
mark{background:#fde68a;color:#92400e;border-radius:3px;padding:0 1px;font-weight:600}
.result-info{font-size:13px;color:var(--c-muted);margin-left:auto;font-family:var(--f-mono)}
.panel-intro{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:var(--r-md);padding:14px 18px;margin-bottom:16px;color:#1e3a8a;font-size:13px;line-height:1.6}

.table-wrap{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.table-scroll{overflow-x:auto;max-height:75vh}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{position:sticky;top:0;background:var(--c-head);color:var(--c-head-tx);text-align:left;padding:12px 14px;font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none;z-index:3}

table th .sort-ind{margin-left:4px;opacity:.5;font-size:10px}
table th.sorted .sort-ind{opacity:1;color:#60a5fa}
table td{padding:10px 14px;border-bottom:1px solid var(--c-border-lt);vertical-align:top}
table tbody tr{transition:background .12s}
table tbody tr:hover{background:#f8faff}
table tbody tr:last-child td{border-bottom:0}
.col-name{min-width:220px}

.en-name{display:block;font-size:11px;color:var(--c-muted);font-family:var(--f-mono);margin-top:2px}

.col-address,.col-hq,.col-region{min-width:160px}

.bar-val{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--c-text);min-width:80px;text-align:right}

@media print{

function regionKey(o){
  var raw;
  if(typeof o==='string')raw=o;
  else raw=(o.prov!=null?o.prov:(o.hq!=null?o.hq:(o.region!=null?o.region:'')));
  raw=String(raw).replace(/^中国·/,'').trim();
  if(!raw||raw==='—')return '未标注';
  for(var i=0;i<PROVINCES.length;i++){if(raw.indexOf(PROVINCES[i])!==-1)return PROVINCES[i];}
  for(var i=0;i<COUNTRIES.length;i++){if(raw.indexOf(COUNTRIES[i])!==-1)return COUNTRIES[i];}
  return raw.length>3?raw.slice(0,2):raw;
}

function highlight(text,q){
  text=String(text==null?'':text);
  if(!q)return escapeHtml(text);
  var i=text.toLowerCase().indexOf(String(q).toLowerCase());
  if(i===-1)return escapeHtml(text);
  return escapeHtml(text.slice(0,i))+'<mark>'+escapeHtml(text.slice(i,i+q.length))+'</mark>'+escapeHtml(text.slice(i+q.length));
}

var EXHIBITOR_ROWS=(function(){
  var rows=[];var tmp=document.createElement('tbody');tmp.innerHTML=EXHIBITOR_TBODY;
  tmp.querySelectorAll('tr').forEach(function(tr){
    var nm=tr.querySelector('.cn-name');var en=tr.querySelector('.en-name');
    var addr=tr.querySelector('.col-address');var web=tr.querySelector('.col-website');
    rows.push({name:nm?nm.textContent.trim():'',en:en?en.textContent.trim():'',category:tr.dataset.category||'',search:tr.dataset.search||'',prov:regionKey(addr?addr.textContent.trim():''),website:web?web.textContent.trim():''});
  });
  return rows;
})();

function init(){

    return '<button class="tab-btn'+(t.id===currentTab?' active':'')+'" data-tab="'+t.id+'">'+t.icon+' '+t.name+' <span class="cnt">'+t.count+'</span></button>';

    var btn=e.target.closest('.tab-btn');

  document.getElementById('catFilter').addEventListener('change',applyFilters);

function switchTab(id){
  currentTab=id;
  sortState={col:null,dir:1};
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===id)});
  renderCurrent();
}

function populateCategories(){
  var cats=[];
  TABS.forEach(function(t){
    if(t.id==='exhibitor'){
      EXHIBITOR_ROWS.forEach(function(o){String(o.category).split('|').forEach(function(c){c=c.trim();if(c&&cats.indexOf(c)===-1)cats.push(c)})});
    }else{
      (DATA[t.id]||[]).forEach(function(o){if(o.cat&&cats.indexOf(o.cat)===-1)cats.push(o.cat)});
    }
  });
  cats.sort(function(a,b){return a.localeCompare(b,'zh-Hans-CN')});
  document.getElementById('catFilter').innerHTML='<option value="">全部类别 ('+cats.length+')</option>'+cats.map(function(c){return '<option value="'+escapeAttr(c)+'">'+escapeHtml(c)+'</option>'}).join('');
  var provs=[];
  TABS.forEach(function(t){
    if(t.id==='exhibitor'){
      EXHIBITOR_ROWS.forEach(function(o){var p=o.prov;if(p&&provs.indexOf(p)===-1)provs.push(p)});
    }else{
      (DATA[t.id]||[]).forEach(function(o){var p=regionKey(o);if(p&&provs.indexOf(p)===-1)provs.push(p)});
    }
  });
  provs.sort(function(a,b){return a.localeCompare(b,'zh-Hans-CN')});
  document.getElementById('provFilter').innerHTML='<option value="">全部地区 ('+provs.length+')</option>'+provs.map(function(c){return '<option value="'+escapeAttr(c)+'">'+escapeHtml(c)+'</option>'}).join('');
}

function renderCurrent(){
  var tab=TABS.find(function(t){return t.id===currentTab});
  document.getElementById('content').innerHTML=tab.render();
  var total=document.querySelectorAll('#content tbody tr[data-search]').length;
  document.getElementById('resultInfo').textContent='显示 '+total+' / '+tab.count+' 条';
  document.querySelectorAll('#content thead th[data-sort]').forEach(function(th){
    th.addEventListener('click',function(){
      var col=th.dataset.sort;
      if(sortState.col===col)sortState.dir*=-1;
      else{sortState.col=col;sortState.dir=1}
      sortTable(col,sortState.dir);
    });
  });
  applyFilters();
}

function applyFilters(){
  var q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  var cat=document.getElementById('catFilter').value;
  var prov=document.getElementById('provFilter').value;
  if(q){
    inGlobal=true;
    renderGlobal(q,cat,prov);
    return;
  }
  if(inGlobal){
    inGlobal=false;
    renderCurrent();
    return;
  }
  var panel=document.getElementById('content');
  var rows=panel.querySelectorAll('tbody tr[data-search]');
  var shown=0;
  rows.forEach(function(tr){
    var s=tr.dataset.search.toLowerCase();
    var c=tr.dataset.category||'';
    var p=tr.dataset.prov||'';
    var ok=true;
    if(q&&s.indexOf(q)===-1)ok=false;
    if(cat){var parts=String(c).split('|');if(parts.indexOf(cat)===-1)ok=false;}
    if(prov&&p!==prov)ok=false;
    tr.style.display=ok?'':'none';
    if(ok)shown++;
  });
  panel.querySelectorAll('.group-hd').forEach(function(h){
    var nxt=h.nextElementSibling;var any=false;
    while(nxt&&!nxt.classList.contains('group-hd')){
      if(nxt.tagName==='TR'&&nxt.style.display!=='none'){any=true;break}
      nxt=nxt.nextElementSibling;
    }
    h.style.display=any?'':'none';
  });
  paintHighlight(q);
  var tab=TABS.find(function(t){return t.id===currentTab});
  document.getElementById('resultInfo').textContent='显示 '+shown+' / '+tab.count+' 条';
}

function paintHighlight(q){
  document.querySelectorAll('#content tbody tr[data-name]').forEach(function(tr){
    var td=tr.querySelector('.col-name');if(!td)return;
    var nm=tr.dataset.name||'';var en=tr.dataset.en||'';
    td.innerHTML='<span class="cn-name">'+highlight(nm,q)+'</span>'+(en?'<span class="en-name">'+escapeHtml(en)+'</span>':'');
  });
}

function sortTable(col,dir){
  var tbody=document.querySelector('#content tbody');
  if(!tbody)return;
  var items=Array.prototype.slice.call(tbody.children);
  var groups=[];var current=null;
  items.forEach(function(el){
    if(el.classList.contains('group-hd')){
      current={hd:el,rows:[]};groups.push(current);
    }else{
      if(current)current.rows.push(el);
    }
  });
  if(groups.length===0){
    items.sort(function(a,b){
      var av=(a.dataset['sort_'+col]||tdText(a,col)).toString();
      var bv=(b.dataset['sort_'+col]||tdText(b,col)).toString();
      var an=parseFloat(av),bn=parseFloat(bv);
      if(!isNaN(an)&&!isNaN(bn)&&av===String(an)&&bv===String(bn))return (an-bn)*dir;
      return av.localeCompare(bv,'zh-Hans-CN')*dir;
    });
    items.forEach(function(r){tbody.appendChild(r)});
  }else{
    groups.forEach(function(g){
      g.rows.sort(function(a,b){
        var av=(a.dataset['sort_'+col]||tdText(a,col)).toString();
        var bv=(b.dataset['sort_'+col]||tdText(b,col)).toString();
        var an=parseFloat(av),bn=parseFloat(bv);
        if(!isNaN(an)&&!isNaN(bn)&&av===String(an)&&bv===String(bn))return (an-bn)*dir;
        return av.localeCompare(bv,'zh-Hans-CN')*dir;
      });
      tbody.appendChild(g.hd);
      g.rows.forEach(function(r){tbody.appendChild(r)});
    });
  }
  document.querySelectorAll('#content thead th').forEach(function(th){
    th.classList.toggle('sorted',th.dataset.sort===col);
    var ind=th.querySelector('.sort-ind');
    if(ind)ind.textContent=th.dataset.sort===col?(dir>1?'▲':'▼'):'⇅';
  });
}
function tdText(tr,col){
  if(!tr||!tr.querySelectorAll)return '';
  var idx={name:0,category:1,cat:1,type:1,booth:2,rank:0,address:3,website:4,email:5,phone:6,desc:7,gwh:2,share:3,hq:4,region:1,city:1,prod:3,note:3};
  var i=idx[col]||0;
  var td=tr.querySelectorAll('td')[i];
  return td?td.textContent.trim():'';

      html+='<tr data-search="'+s+'" data-prov="'+escapeAttr(regionKey(d))+'" data-name="'+escapeAttr(d.name)+'" data-en="'+escapeAttr(d.en||'')+'" data-category="'+escapeAttr(d.cat)+'" data-sort_name="'+escapeAttr(d.name)+'">'+
        '<td class="col-name"><span class="cn-name">'+escapeHtml(d.name)+'</span></td>'+
        '<td>'+escapeHtml(d.region)+'</td>'+
        '<td><span class="sub-tag">'+escapeHtml(d.type)+'</span></td>'+
        '<td class="col-desc">'+escapeHtml(d.note||'—')+'</td>'+
        '<td class="col-website">'+(d.website?'<a href="'+d.website+'" target="_blank" rel="noopener">'+escapeHtml(d.website.replace(/^https?:\/\/(?:www\.)?/,'').split('/')[0])+'</a>':'—')+'</td>'+
      '</tr>';
    });
  }
  order.forEach(function(c){if(groups[c])renderGroup(c,groups[c])});
  Object.keys(groups).forEach(function(c){if(order.indexOf(c)===-1)renderGroup(c,groups[c])});
  return '<div class="panel-intro"><strong>🧠 算法 / 算力 / AI 大脑</strong> — '+DATA.robotAlg.length+' 家，涵盖具身大脑/操作系统、AIGC 芯片、数据采集、算力训练、通讯模组等。</div>'+
    '<div class="table-wrap"><div class="table-scroll"><table><thead><tr>'+
    '<th data-sort="name">企业/机构 <span class="sort-ind">⇅</span></th>'+
    '<th data-sort="name">地区 <span class="sort-ind">⇅</span></th>'+
    '<th data-sort="cat">类型 <span class="sort-ind">⇅</span></th>'+
    '<th>产品/备注 <span class="sort-ind">⇅</span></th>'+
    '<th>官网 <span class="sort-ind">⇅</span></th>'+
    '</tr></thead><tbody>'+html+'</tbody></table></div></div>';
}

function renderGlobal(q,cat,prov){
  q=(q||'').toLowerCase();
  var out=[];var matched=0;var tabSet={};
  TABS.forEach(function(t){
    var items=(t.id==='exhibitor')?EXHIBITOR_ROWS:(DATA[t.id]||[]);
    items.forEach(function(o){
      var name,en,rawCat,region,website,search;
      if(t.id==='exhibitor'){
        name=o.name;en=o.en;rawCat=o.category;region=o.prov;website=o.website;search=o.search;
      }else{
        name=o.name;en=o.en||'';rawCat=o.cat;region=regionKey(o);website=o.website||'';search='';
        for(var k in o){if(typeof o[k]==='string')search+=' '+o[k];}
        search=search.toLowerCase();
      }
      var hay=(name+' '+(en||'')+' '+rawCat+' '+region+' '+search).toLowerCase();
      if(q&&hay.indexOf(q)===-1)return;
      if(cat){var parts=String(rawCat).split('|');if(parts.indexOf(cat)===-1)return;}
      if(prov&&region!==prov)return;
      matched++;tabSet[t.name]=1;
      var cat2=(t.id==='exhibitor')?rawCat:(o.cat||o.type||'');
      var wdisp=website?'<a href="'+escapeAttr(website)+'" target="_blank" rel="noopener">'+escapeHtml(website.replace(/^https?:\/\/(?:www\.)?/,'').split('/')[0])+'</a>':'—';
      out.push('<tr data-search="'+escapeAttr(hay)+'" data-category="'+escapeAttr(rawCat)+'" data-prov="'+escapeAttr(region)+'" data-sort_name="'+escapeAttr(name)+'" data-sort_tab="'+escapeAttr(t.name)+'" data-sort_region="'+escapeAttr(region)+'" data-sort_cat="'+escapeAttr(cat2)+'">'+
        '<td class="col-name"><span class="cn-name">'+highlight(name,q)+'</span>'+(en?'<span class="en-name">'+escapeHtml(en)+'</span>':'')+'</td>'+
        '<td><span class="cat-tag">'+escapeHtml(t.name)+'</span></td>'+
        '<td>'+highlight(region,q)+'</td>'+
        '<td><span class="sub-tag">'+highlight(cat2,q)+'</span></td>'+
        '<td class="col-website">'+wdisp+'</td>'+
      '</tr>');
    });
  });
  var intro='<div class="panel-intro"><strong>🔎 跨分类搜索</strong> — 关键词「'+escapeHtml(q||'')+'」匹配 <b>'+matched+'</b> 条，覆盖 '+Object.keys(tabSet).length+' 个分类'+(cat?' · 类别：'+escapeHtml(cat):'')+(prov?' · 地区：'+escapeHtml(prov):'')+'。清空搜索框可返回分类视图。</div>';
  var table='<div class="table-wrap"><div class="table-scroll"><table><thead><tr>'+
    '<th data-sort="name">企业/机构 <span class="sort-ind">⇅</span></th>'+
    '<th data-sort="tab">所属分类 <span class="sort-ind">⇅</span></th>'+
    '<th data-sort="region">地区 <span class="sort-ind">⇅</span></th>'+
    '<th data-sort="cat">类别 <span class="sort-ind">⇅</span></th>'+
    '<th>官网 <span class="sort-ind">⇅</span></th>'+
  '</tr></thead><tbody>'+out.join('')+'</tbody></table></div></div>';
  document.getElementById('content').innerHTML=intro+table;
  document.getElementById('resultInfo').textContent='全局匹配 '+matched+' 条';
  document.querySelectorAll('#content thead th[data-sort]').forEach(function(th){
    th.addEventListener('click',function(){
      var col=th.dataset.sort;
      if(sortState.col===col)sortState.dir*=-1;
      else{sortState.col=col;sortState.dir=1}
      sortTable(col,sortState.dir);
    });
  });
}

function exportCSV(){
  var panel=document.getElementById('content');
  var table=panel.querySelector('table');
  if(!table)return;
  var csv=[];
  var headers=[];
  table.querySelectorAll('thead th').forEach(function(th){headers.push(th.textContent.replace(/⇅|▲|▼/g,'').trim())});
  csv.push(headers.map(function(h){return '"'+h.replace(/"/g,'""')+'"'}).join(','));
  table.querySelectorAll('tbody tr').forEach(function(tr){
    if(tr.style.display==='none'||tr.classList.contains('group-hd'))return;
    var cells=[];
    tr.querySelectorAll('td').forEach(function(td){
      var t=td.textContent.trim().replace(/"/g,'""').replace(/\s+/g,' ');
      cells.push('"'+t+'"');
    });
    if(cells.length)csv.push(cells.join(','));
  });
  var blob=new Blob(['\uFEFF'+csv.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=currentTab+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}

document.addEventListener('DOMContentLoaded',init);
})();
</script>
